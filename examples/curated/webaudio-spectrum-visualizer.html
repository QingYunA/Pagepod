<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WebAudio Realtime 3D Spectrum Analyzer</title>
  <style>
    :root {
      --bg: #09090b;
      --card-bg: #121215;
      --border: #27272a;
      --text: #f4f4f5;
      --text-muted: #a1a1aa;
      --cyan: #06b6d4;
      --purple: #a855f7;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px;
      overflow-x: hidden;
    }
    header {
      width: 100%;
      max-width: 1100px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 16px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .brand h1 {
      font-size: 16px;
      font-weight: 600;
    }
    .badge {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 999px;
      border: 1px solid var(--border);
      color: var(--text-muted);
    }
    .main-stage {
      width: 100%;
      max-width: 1100px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 16px 40px rgba(0,0,0,0.6);
    }
    .canvas-container {
      position: relative;
      width: 100%;
      height: 480px;
      background: radial-gradient(circle at center, #15151c 0%, #09090b 100%);
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    .controls-bar {
      padding: 14px 20px;
      background: #0f0f13;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }
    .btn-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    button, select {
      background: #1c1c22;
      color: var(--text);
      border: 1px solid var(--border);
      padding: 7px 14px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
    }
    button:hover, select:hover {
      background: #27272e;
      border-color: #3f3f46;
    }
    button.primary {
      background: #3b82f6;
      border-color: #60a5fa;
      color: #fff;
    }
    button.primary:hover {
      background: #2563eb;
    }
    .vol-control {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: var(--text-muted);
    }
    input[type="range"] {
      accent-color: #3b82f6;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <h1>WebAudio Realtime 3D Spectrum Analyzer</h1>
      <span class="badge">60FPS FFT Engine</span>
      <span class="badge">MIT License</span>
    </div>
    <div style="font-size: 12px; color: var(--text-muted);">
      Pure HTML5 Web Audio API
    </div>
  </header>

  <div class="main-stage">
    <div class="canvas-container">
      <canvas id="visualizerCanvas"></canvas>
    </div>

    <div class="controls-bar">
      <div class="btn-group">
        <button id="btnToggleAudio" class="primary">▶ Play Generative Ambient Synth</button>
        <button id="btnMic">🎙 Use Microphone</button>
      </div>

      <div class="btn-group">
        <select id="modeSelect">
          <option value="radial">Radial Circular Spectrum</option>
          <option value="bars">3D Mirrored Frequency Bars</option>
          <option value="particles">Cosmic Particle Nebula</option>
          <option value="wave">Lissajous Oscilloscope</option>
        </select>
        <div class="vol-control">
          <span>Volume</span>
          <input type="range" id="volSlider" min="0" max="1" step="0.05" value="0.5" style="width: 80px;">
        </div>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('visualizerCanvas');
    const ctx = canvas.getContext('2d');
    const btnToggleAudio = document.getElementById('btnToggleAudio');
    const btnMic = document.getElementById('btnMic');
    const modeSelect = document.getElementById('modeSelect');
    const volSlider = document.getElementById('volSlider');

    function resize() {
      canvas.width = canvas.parentElement.clientWidth;
      canvas.height = canvas.parentElement.clientHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    let audioCtx = null;
    let analyser = null;
    let gainNode = null;
    let synthTimer = null;
    let isPlayingSynth = false;
    let usingMic = false;
    let dataArray = null;
    let bufferLength = 0;

    // Ambient chords (Hz)
    const CHORDS = [
      [130.81, 196.00, 261.63, 329.63], // C major 7
      [146.83, 220.00, 293.66, 349.23], // D minor 7
      [110.00, 164.81, 220.00, 261.63], // A minor 7
      [174.61, 261.63, 329.63, 392.00]  // F major 7
    ];
    let chordIdx = 0;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 512;
        analyser.smoothingTimeConstant = 0.85;
        bufferLength = analyser.frequencyBinCount;
        dataArray = new Uint8Array(bufferLength);

        gainNode = audioCtx.createGain();
        gainNode.gain.value = parseFloat(volSlider.value);
        gainNode.connect(audioCtx.destination);
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function playChord() {
      if (!isPlayingSynth) return;
      const notes = CHORDS[chordIdx];
      chordIdx = (chordIdx + 1) % CHORDS.length;

      notes.forEach((freq, idx) => {
        const osc = audioCtx.createOscillator();
        const noteGain = audioCtx.createGain();
        osc.type = idx === 0 ? 'triangle' : 'sine';
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);

        noteGain.gain.setValueAtTime(0.01, audioCtx.currentTime);
        noteGain.gain.linearRampToValueAtTime(0.12, audioCtx.currentTime + 0.8);
        noteGain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 3.8);

        osc.connect(noteGain);
        noteGain.connect(analyser);
        analyser.connect(gainNode);

        osc.start();
        osc.stop(audioCtx.currentTime + 4.0);
      });

      synthTimer = setTimeout(playChord, 3200);
    }

    btnToggleAudio.addEventListener('click', () => {
      initAudio();
      if (isPlayingSynth) {
        isPlayingSynth = false;
        clearTimeout(synthTimer);
        btnToggleAudio.textContent = '▶ Play Generative Ambient Synth';
        btnToggleAudio.classList.remove('primary');
      } else {
        isPlayingSynth = true;
        usingMic = false;
        playChord();
        btnToggleAudio.textContent = '⏸ Pause Ambient Synth';
        btnToggleAudio.classList.add('primary');
      }
    });

    btnMic.addEventListener('click', async () => {
      initAudio();
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        const source = audioCtx.createMediaStreamSource(stream);
        source.connect(analyser);
        usingMic = true;
        isPlayingSynth = false;
        clearTimeout(synthTimer);
        btnMic.textContent = '🎙 Mic Active';
        btnToggleAudio.textContent = '▶ Play Ambient Synth';
      } catch (err) {
        alert('Microphone access denied or not available.');
      }
    });

    volSlider.addEventListener('input', (e) => {
      if (gainNode) gainNode.gain.value = parseFloat(e.target.value);
    });

    // Particles for Nebula Mode
    const particles = Array.from({ length: 80 }, () => ({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      radius: Math.random() * 2 + 1,
      baseSpeed: Math.random() * 0.5 + 0.2
    }));

    function draw() {
      requestAnimationFrame(draw);
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (!analyser) {
        // Idle animation
        ctx.fillStyle = '#71717a';
        ctx.font = '13px monospace';
        ctx.textAlign = 'center';
        ctx.fillText('Press Play or Mic to activate WebAudio Spectrum', canvas.width / 2, canvas.height / 2);
        return;
      }

      analyser.getByteFrequencyData(dataArray);
      const mode = modeSelect.value;
      const cx = canvas.width / 2;
      const cy = canvas.height / 2;

      if (mode === 'radial') {
        const radius = Math.min(cx, cy) * 0.45;
        const count = 120;
        const step = (Math.PI * 2) / count;

        for (let i = 0; i < count; i++) {
          const val = dataArray[i % bufferLength];
          const barLen = (val / 255) * 90;
          const rad = i * step;

          const x1 = cx + Math.cos(rad) * radius;
          const y1 = cy + Math.sin(rad) * radius;
          const x2 = cx + Math.cos(rad) * (radius + barLen);
          const y2 = cy + Math.sin(rad) * (radius + barLen);

          ctx.strokeStyle = `hsl(${180 + (val / 255) * 100}, 90%, 60%)`;
          ctx.lineWidth = 2.5;
          ctx.beginPath();
          ctx.moveTo(x1, y1);
          ctx.lineTo(x2, y2);
          ctx.stroke();
        }

        // Center ring
        ctx.strokeStyle = 'rgba(255,255,255,0.2)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.arc(cx, cy, radius, 0, Math.PI * 2);
        ctx.stroke();

      } else if (mode === 'bars') {
        const barWidth = (canvas.width / bufferLength) * 2.2;
        let x = 0;

        for (let i = 0; i < bufferLength / 2; i++) {
          const barHeight = (dataArray[i] / 255) * (canvas.height * 0.7);

          const grad = ctx.createLinearGradient(0, canvas.height, 0, canvas.height - barHeight);
          grad.addColorStop(0, '#3b82f6');
          grad.addColorStop(0.5, '#a855f7');
          grad.addColorStop(1, '#ec4899');

          ctx.fillStyle = grad;
          ctx.fillRect(x, canvas.height - barHeight, barWidth - 1, barHeight);

          x += barWidth;
        }

      } else if (mode === 'particles') {
        let avgFreq = 0;
        for (let i = 0; i < 30; i++) avgFreq += dataArray[i];
        avgFreq = avgFreq / 30 / 255;

        particles.forEach((p, idx) => {
          p.y -= p.baseSpeed * (1 + avgFreq * 4);
          if (p.y < 0) { p.y = canvas.height; p.x = Math.random() * canvas.width; }

          ctx.save();
          ctx.fillStyle = `rgba(56, 189, 248, ${0.4 + avgFreq * 0.6})`;
          ctx.shadowColor = '#06b6d4';
          ctx.shadowBlur = avgFreq * 16;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.radius * (1 + avgFreq * 1.5), 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        });

      } else if (mode === 'wave') {
        analyser.getByteTimeDomainData(dataArray);
        ctx.lineWidth = 2;
        ctx.strokeStyle = '#22d3ee';
        ctx.beginPath();

        const sliceWidth = canvas.width / bufferLength;
        let x = 0;
        for (let i = 0; i < bufferLength; i++) {
          const v = dataArray[i] / 128.0;
          const y = (v * canvas.height) / 2;

          if (i === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
          x += sliceWidth;
        }
        ctx.stroke();
      }
    }

    draw();
  </script>
</body>
</html>
