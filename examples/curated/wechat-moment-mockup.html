<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>朋友圈界面模拟器 - 社交动态排版与预览 (Social Feed)</title>
  <style>
    :root {
      --bg: #09090b;
      --card-bg: #121215;
      --border: #27272a;
      --text: #f4f4f5;
      --text-muted: #a1a1aa;
      --link: #576b95;
      --bubble-bg: #f7f7f7;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }
    header {
      width: 100%;
      max-width: 1080px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 24px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .brand h1 {
      font-size: 16px;
      font-weight: 600;
    }
    .badge {
      font-size: 12px;
      padding: 2px 8px;
      border-radius: 999px;
      border: 1px solid var(--border);
      color: var(--text-muted);
    }
    .workspace {
      display: grid;
      grid-template-columns: 420px 1fr;
      gap: 32px;
      width: 100%;
      max-width: 1080px;
    }
    @media (max-width: 900px) {
      .workspace { grid-template-columns: 1fr; }
    }

    /* Phone Shell Mockup */
    .phone-container {
      display: flex;
      justify-content: center;
    }
    .phone-frame {
      width: 380px;
      background: #ffffff;
      color: #191919;
      border-radius: 40px;
      box-shadow: 0 24px 60px rgba(0,0,0,0.7), 0 0 0 10px #1e1e24;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      height: 680px;
      position: relative;
    }
    .status-bar {
      padding: 12px 24px 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      font-weight: 600;
      color: #000;
    }
    .nav-bar {
      padding: 8px 16px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #f0f0f0;
      font-size: 15px;
      font-weight: 600;
    }
    .feed-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      background: #fff;
    }
    .post-item {
      display: flex;
      gap: 12px;
    }
    .avatar {
      width: 44px;
      height: 44px;
      border-radius: 6px;
      background: #4f46e5;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 16px;
      flex-shrink: 0;
    }
    .post-content {
      flex: 1;
    }
    .post-author {
      font-size: 15px;
      font-weight: 600;
      color: var(--link);
      margin-bottom: 4px;
    }
    .post-text {
      font-size: 14px;
      line-height: 1.5;
      color: #111;
      margin-bottom: 10px;
      white-space: pre-wrap;
    }
    .media-grid {
      display: grid;
      gap: 4px;
      margin-bottom: 10px;
    }
    .media-grid.grid-1 { grid-template-columns: 200px; }
    .media-grid.grid-4 { grid-template-columns: repeat(2, 90px); }
    .media-grid.grid-9 { grid-template-columns: repeat(3, 80px); }
    .media-cell {
      height: 80px;
      background: #e2e8f0;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      color: #64748b;
    }
    .media-grid.grid-1 .media-cell { height: 160px; font-size: 13px; }
    .media-grid.grid-4 .media-cell { height: 90px; }

    .post-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      color: #8c8c8c;
      margin-bottom: 8px;
    }
    .action-btn {
      background: #f2f2f2;
      padding: 3px 8px;
      border-radius: 4px;
      cursor: pointer;
      color: var(--link);
      font-weight: bold;
    }
    .interaction-box {
      background: #f7f7f7;
      border-radius: 4px;
      padding: 6px 10px;
      font-size: 13px;
      line-height: 1.6;
    }
    .likes-line {
      color: var(--link);
      border-bottom: 1px solid #ebebeb;
      padding-bottom: 4px;
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 12px;
    }
    .comment-item {
      color: #333;
    }
    .comment-author {
      color: var(--link);
      font-weight: 500;
    }

    /* Editor Controls */
    .controls-panel {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px;
    }
    .card-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 12px;
    }
    .form-group {
      margin-bottom: 12px;
    }
    label {
      display: block;
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 6px;
    }
    input[type="text"], textarea, select {
      width: 100%;
      background: #18181b;
      color: var(--text);
      border: 1px solid var(--border);
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 13px;
      outline: none;
    }
    textarea { height: 80px; resize: vertical; }
    .btn {
      background: #25252b;
      color: var(--text);
      border: 1px solid var(--border);
      padding: 8px 14px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
    }
    .btn:hover { background: #32323a; }
    .btn.primary { background: #3b82f6; border-color: #60a5fa; color: #fff; }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <h1>朋友圈界面模拟器</h1>
      <span class="badge">移动端高保真预览</span>
      <span class="badge">MIT License</span>
    </div>
    <div>
      <button class="btn" id="btnPresetLaunch">载入发布会文案</button>
      <button class="btn" id="btnPresetDaily">载入生活日常</button>
    </div>
  </header>

  <div class="workspace">
    <!-- Phone Mockup -->
    <div class="phone-container">
      <div class="phone-frame" id="phoneCaptureTarget">
        <div class="status-bar">
          <span>9:41</span>
          <span>5G 100%</span>
        </div>
        <div class="nav-bar">
          <span>‹ 朋友圈</span>
          <span>📷</span>
        </div>
        <div class="feed-scroll">
          <div class="post-item">
            <div class="avatar" id="dispAvatar">青</div>
            <div class="post-content">
              <div class="post-author" id="dispAuthor">云青实验室</div>
              <div class="post-text" id="dispText">经过数周密闭打磨，Pagepod 全新纯自包含开源 HTML 展厅正式上线！基于极简 Zinc 工业美学，零外部不可靠 CDN 依赖，毫秒级独立沙箱运行。欢迎同道朋友品鉴交流！</div>
              <div class="media-grid grid-4" id="dispMediaGrid">
                <div class="media-cell" style="background: #3b82f6; color: #fff;">配图 1</div>
                <div class="media-cell" style="background: #10b981; color: #fff;">配图 2</div>
                <div class="media-cell" style="background: #8b5cf6; color: #fff;">配图 3</div>
                <div class="media-cell" style="background: #f59e0b; color: #fff;">配图 4</div>
              </div>
              <div class="post-meta">
                <span id="dispTime">10 分钟前 · 深圳市</span>
                <span class="action-btn">••</span>
              </div>
              <div class="interaction-box">
                <div class="likes-line">
                  <span>♡</span>
                  <span id="dispLikes">林总, 张架构, 研发团队, 李产品</span>
                </div>
                <div id="dispComments">
                  <div class="comment-item"><span class="comment-author">张架构:</span> 纯单文件离线加载真舒服，赞！</div>
                  <div class="comment-item"><span class="comment-author">李产品:</span> 工业美感很在线，期待后续功能！</div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Controls Panel -->
    <div class="controls-panel">
      <div class="card">
        <div class="card-title">基本信息与文案编辑</div>
        <div class="form-group">
          <label>发布者昵称</label>
          <input type="text" id="inputAuthor" value="云青实验室">
        </div>
        <div class="form-group">
          <label>动态正文内容</label>
          <textarea id="inputText">经过数周密闭打磨，Pagepod 全新纯自包含开源 HTML 展厅正式上线！基于极简 Zinc 工业美学，零外部不可靠 CDN 依赖，毫秒级独立沙箱运行。欢迎同道朋友品鉴交流！</textarea>
        </div>
        <div class="form-group">
          <label>图片九宫格排版布局</label>
          <select id="selectGrid">
            <option value="4">4 张图片 (2x2 对称排版)</option>
            <option value="1">1 张大图 (单图横幅视差)</option>
            <option value="9">9 张图片 (九宫格矩阵)</option>
            <option value="0">无配图 (纯文字动态)</option>
          </select>
        </div>
        <div class="form-group">
          <label>发布时间与地点</label>
          <input type="text" id="inputMeta" value="10 分钟前 · 深圳市">
        </div>
      </div>

      <div class="card">
        <div class="card-title">互动数据模拟</div>
        <div class="form-group">
          <label>点赞用户列表 (英文逗号分隔)</label>
          <input type="text" id="inputLikes" value="林总, 张架构, 研发团队, 李产品">
        </div>
        <div style="display: flex; gap: 10px; margin-top: 16px;">
          <button class="btn primary" id="btnCopyJson">复制配置 JSON</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const inputAuthor = document.getElementById('inputAuthor');
    const inputText = document.getElementById('inputText');
    const selectGrid = document.getElementById('selectGrid');
    const inputMeta = document.getElementById('inputMeta');
    const inputLikes = document.getElementById('inputLikes');

    const dispAvatar = document.getElementById('dispAvatar');
    const dispAuthor = document.getElementById('dispAuthor');
    const dispText = document.getElementById('dispText');
    const dispMediaGrid = document.getElementById('dispMediaGrid');
    const dispTime = document.getElementById('dispTime');
    const dispLikes = document.getElementById('dispLikes');

    function sync() {
      dispAuthor.textContent = inputAuthor.value || '匿名用户';
      dispAvatar.textContent = (inputAuthor.value || '匿')[0];
      dispText.textContent = inputText.value;
      dispTime.textContent = inputMeta.value;
      dispLikes.textContent = inputLikes.value;

      const gridCount = parseInt(selectGrid.value, 10);
      dispMediaGrid.innerHTML = '';
      if (gridCount === 0) {
        dispMediaGrid.style.display = 'none';
      } else {
        dispMediaGrid.style.display = 'grid';
        dispMediaGrid.className = `media-grid grid-${gridCount}`;
        const colors = ['#3b82f6', '#10b981', '#8b5cf6', '#f59e0b', '#ec4899', '#06b6d4', '#64748b', '#ef4444', '#14b8a6'];
        for (let i = 0; i < gridCount; i++) {
          const cell = document.createElement('div');
          cell.className = 'media-cell';
          cell.style.background = colors[i % colors.length];
          cell.style.color = '#ffffff';
          cell.textContent = `配图 ${i + 1}`;
          dispMediaGrid.appendChild(cell);
        }
      }
    }

    [inputAuthor, inputText, selectGrid, inputMeta, inputLikes].forEach(el => {
      el.addEventListener('input', sync);
    });

    document.getElementById('btnPresetDaily').addEventListener('click', () => {
      inputAuthor.value = '摄影师苏木';
      inputText.value = '初秋九月，穿过薄雾初起的水杉林。光影透过枝桠在苔藓上投下微光，秋天真的悄悄来到了身边。🍂📷';
      selectGrid.value = '9';
      inputMeta.value = '今天 08:30 · 杭州九溪烟树';
      inputLikes.value = '苏苏, 咖啡小友, 露营俱乐部';
      sync();
    });

    document.getElementById('btnPresetLaunch').addEventListener('click', () => {
      inputAuthor.value = '云青实验室';
      inputText.value = '经过数周密闭打磨，Pagepod 全新纯自包含开源 HTML 展厅正式上线！基于极简 Zinc 工业美学，零外部不可靠 CDN 依赖，毫秒级独立沙箱运行。欢迎同道朋友品鉴交流！';
      selectGrid.value = '4';
      inputMeta.value = '10 分钟前 · 深圳市';
      inputLikes.value = '林总, 张架构, 研发团队, 李产品';
      sync();
    });

    document.getElementById('btnCopyJson').addEventListener('click', () => {
      const payload = {
        author: inputAuthor.value,
        text: inputText.value,
        grid: selectGrid.value,
        meta: inputMeta.value,
        likes: inputLikes.value
      };
      navigator.clipboard.writeText(JSON.stringify(payload, null, 2));
      alert('已复制原型配置 JSON');
    });

    sync();
  </script>
</body>
</html>
