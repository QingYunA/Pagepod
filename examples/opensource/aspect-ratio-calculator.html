<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aspect Ratio Calculator</title>
  <!--
    Open Source Provenance:
    Author: Video & Design Tools Collective
    License: MIT
  -->
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #fafafa;
      color: #18181b;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .card {
      max-width: 440px;
      width: 100%;
      background: #ffffff;
      border: 1px solid #e4e4e7;
      border-radius: 20px;
      padding: 2rem;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
    }
    h1 { font-size: 1.25rem; font-weight: 700; margin-bottom: 0.25rem; letter-spacing: -0.02em; color: #09090b; }
    p { font-size: 0.85rem; color: #71717a; margin-bottom: 1.5rem; }
    .ratio-presets {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      margin-bottom: 1.5rem;
    }
    .preset-btn {
      background: #f4f4f5;
      border: 1px solid #e4e4e7;
      color: #18181b;
      border-radius: 8px;
      padding: 0.4rem;
      font-size: 0.8rem;
      font-family: ui-monospace, monospace;
      cursor: pointer;
      transition: all 0.15s;
    }
    .preset-btn:hover { background: #e4e4e7; }
    .input-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 1.5rem;
    }
    label { font-size: 0.75rem; color: #71717a; font-family: ui-monospace, monospace; display: block; margin-bottom: 4px; }
    input[type="number"] {
      width: 100%;
      height: 42px;
      border-radius: 10px;
      border: 1px solid #e4e4e7;
      background: #ffffff;
      color: #18181b;
      padding: 0 0.75rem;
      font-size: 0.95rem;
      font-family: ui-monospace, monospace;
      outline: none;
    }
    input[type="number"]:focus { border-color: #2563eb; }
    .ratio-result {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 1rem;
      text-align: center;
      margin-bottom: 1.5rem;
    }
    .ratio-display {
      font-size: 1.75rem;
      font-weight: 800;
      color: #0284c7;
      font-family: ui-monospace, monospace;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Aspect Ratio Calculator</h1>
    <p>Calculate pixel dimensions and simplify aspect ratios instantly.</p>

    <div class="ratio-presets">
      <button class="preset-btn" onclick="applyPreset(16, 9)">16:9</button>
      <button class="preset-btn" onclick="applyPreset(4, 3)">4:3</button>
      <button class="preset-btn" onclick="applyPreset(1, 1)">1:1</button>
      <button class="preset-btn" onclick="applyPreset(21, 9)">21:9</button>
    </div>

    <div class="input-grid">
      <div>
        <label>WIDTH (PX)</label>
        <input type="number" id="width" value="1920" oninput="calculateFromWidth()">
      </div>
      <div>
        <label>HEIGHT (PX)</label>
        <input type="number" id="height" value="1080" oninput="calculateFromHeight()">
      </div>
    </div>

    <div class="ratio-result">
      <label>SIMPLIFIED RATIO</label>
      <div class="ratio-display" id="ratio">16:9</div>
    </div>
  </div>

  <script>
    function gcd(a, b) {
      return b === 0 ? a : gcd(b, a % b);
    }

    let targetRatio = 16 / 9;

    function applyPreset(w, h) {
      targetRatio = w / h;
      document.getElementById('width').value = 1920;
      document.getElementById('height').value = Math.round(1920 / targetRatio);
      updateDisplay();
    }

    function calculateFromWidth() {
      const w = parseFloat(document.getElementById('width').value) || 0;
      if (w > 0) {
        document.getElementById('height').value = Math.round(w / targetRatio);
      }
      updateDisplay();
    }

    function calculateFromHeight() {
      const h = parseFloat(document.getElementById('height').value) || 0;
      if (h > 0) {
        document.getElementById('width').value = Math.round(h * targetRatio);
      }
      updateDisplay();
    }

    function updateDisplay() {
      const w = parseInt(document.getElementById('width').value, 10) || 1;
      const h = parseInt(document.getElementById('height').value, 10) || 1;
      const divisor = gcd(w, h);
      document.getElementById('ratio').textContent = `${w / divisor}:${h / divisor}`;
    }

    updateDisplay();
  </script>
</body>
</html>
