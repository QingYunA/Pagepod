<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Neon 2048 · Cyberpunk Edition</title>
  <style>
    :root {
      --bg: #09090b;
      --board-bg: #18181b;
      --empty-cell: #27272a;
      --text: #f4f4f5;
      --accent: #06b6d4;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      touch-action: none;
    }
    .game-container {
      width: 100%;
      max-width: 380px;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .title {
      font-size: 2rem;
      font-weight: 900;
      letter-spacing: -0.04em;
      color: var(--accent);
      text-shadow: 0 0 12px rgba(6, 182, 212, 0.4);
    }
    .scores {
      display: flex;
      gap: 0.5rem;
    }
    .score-box {
      background: var(--board-bg);
      border: 1px solid var(--empty-cell);
      padding: 0.4rem 0.8rem;
      border-radius: 8px;
      text-align: center;
      min-width: 70px;
    }
    .score-label {
      font-size: 0.65rem;
      text-transform: uppercase;
      color: #71717a;
      font-weight: 700;
    }
    .score-val {
      font-size: 1.1rem;
      font-weight: 800;
      color: #fff;
    }
    .board {
      width: 100%;
      aspect-ratio: 1;
      background: var(--board-bg);
      border: 1px solid var(--empty-cell);
      border-radius: 12px;
      padding: 10px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-template-rows: repeat(4, 1fr);
      gap: 10px;
      position: relative;
    }
    .cell {
      background: var(--empty-cell);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      font-weight: 800;
      transition: all 0.12s ease-in-out;
      border: 1px solid transparent;
    }
    .tile-2    { background: #1e293b; color: #94a3b8; border-color: #334155; }
    .tile-4    { background: #0f766e; color: #ccfbf1; border-color: #14b8a6; box-shadow: 0 0 8px rgba(20, 184, 166, 0.3); }
    .tile-8    { background: #0369a1; color: #e0f2fe; border-color: #0ea5e9; box-shadow: 0 0 10px rgba(14, 165, 233, 0.4); }
    .tile-16   { background: #4338ca; color: #e0e7ff; border-color: #6366f1; box-shadow: 0 0 12px rgba(99, 102, 241, 0.4); }
    .tile-32   { background: #7c2d12; color: #ffedd5; border-color: #f97316; box-shadow: 0 0 12px rgba(249, 115, 22, 0.5); }
    .tile-64   { background: #b91c1c; color: #fee2e2; border-color: #ef4444; box-shadow: 0 0 14px rgba(239, 68, 68, 0.6); }
    .tile-128  { background: #a21caf; color: #fdf4ff; border-color: #d946ef; font-size: 1.3rem; box-shadow: 0 0 16px rgba(217, 70, 239, 0.6); }
    .tile-256  { background: #059669; color: #ecfdf5; border-color: #10b981; font-size: 1.3rem; box-shadow: 0 0 18px rgba(16, 185, 129, 0.7); }
    .tile-512  { background: #e11d48; color: #fff1f2; border-color: #f43f5e; font-size: 1.2rem; box-shadow: 0 0 20px rgba(244, 63, 94, 0.8); }
    .tile-1024 { background: #d97706; color: #fffbeb; border-color: #f59e0b; font-size: 1.1rem; box-shadow: 0 0 22px rgba(245, 158, 11, 0.9); }
    .tile-2048 { background: #7e22ce; color: #faf5ff; border-color: #a855f7; font-size: 1.1rem; box-shadow: 0 0 25px rgba(168, 85, 247, 1); animation: pulse 1.5s infinite; }
    @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.04); } }
    .bottom-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.8rem;
      color: #71717a;
    }
    .restart-btn {
      background: var(--empty-cell);
      border: 1px solid #3f3f46;
      color: #fff;
      padding: 0.5rem 1rem;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="game-container">
    <div class="header">
      <div class="title">2048</div>
      <div class="scores">
        <div class="score-box">
          <div class="score-label">Score</div>
          <div class="score-val" id="score">0</div>
        </div>
        <div class="score-box">
          <div class="score-label">Best</div>
          <div class="score-val" id="bestScore">0</div>
        </div>
      </div>
    </div>

    <div class="board" id="board"></div>

    <div class="bottom-bar">
      <span>Swipe or Arrow Keys to move</span>
      <button class="restart-btn" id="restartBtn">New Game</button>
    </div>
  </div>

  <script>
    const boardEl = document.getElementById('board');
    const scoreEl = document.getElementById('score');
    const bestScoreEl = document.getElementById('bestScore');
    const restartBtn = document.getElementById('restartBtn');

    let grid = Array(4).fill().map(() => Array(4).fill(0));
    let score = 0;
    let bestScore = parseInt(localStorage.getItem('neon_2048_best') || '0');
    bestScoreEl.textContent = bestScore;

    function init() {
      grid = Array(4).fill().map(() => Array(4).fill(0));
      score = 0;
      scoreEl.textContent = '0';
      spawnTile();
      spawnTile();
      render();
    }

    function spawnTile() {
      const emptyCells = [];
      for (let r = 0; r < 4; r++) {
        for (let c = 0; c < 4; c++) {
          if (grid[r][c] === 0) emptyCells.push({r, c});
        }
      }
      if (emptyCells.length === 0) return;
      const {r, c} = emptyCells[Math.floor(Math.random() * emptyCells.length)];
      grid[r][c] = Math.random() < 0.9 ? 2 : 4;
    }

    function render() {
      boardEl.innerHTML = '';
      for (let r = 0; r < 4; r++) {
        for (let c = 0; c < 4; c++) {
          const val = grid[r][c];
          const cell = document.createElement('div');
          cell.className = `cell ${val ? 'tile-' + val : ''}`;
          cell.textContent = val > 0 ? val : '';
          boardEl.appendChild(cell);
        }
      }
      scoreEl.textContent = score;
      if (score > bestScore) {
        bestScore = score;
        bestScoreEl.textContent = bestScore;
        localStorage.setItem('neon_2048_best', bestScore);
      }
    }

    function slideRow(row) {
      let arr = row.filter(val => val !== 0);
      for (let i = 0; i < arr.length - 1; i++) {
        if (arr[i] === arr[i + 1]) {
          arr[i] *= 2;
          score += arr[i];
          arr.splice(i + 1, 1);
        }
      }
      while (arr.length < 4) arr.push(0);
      return arr;
    }

    function move(dir) {
      let moved = false;
      const prevGrid = JSON.stringify(grid);

      if (dir === 'left') {
        for (let r = 0; r < 4; r++) grid[r] = slideRow(grid[r]);
      } else if (dir === 'right') {
        for (let r = 0; r < 4; r++) grid[r] = slideRow(grid[r].reverse()).reverse();
      } else if (dir === 'up') {
        for (let c = 0; c < 4; c++) {
          let col = [grid[0][c], grid[1][c], grid[2][c], grid[3][c]];
          let newCol = slideRow(col);
          for (let r = 0; r < 4; r++) grid[r][c] = newCol[r];
        }
      } else if (dir === 'down') {
        for (let c = 0; c < 4; c++) {
          let col = [grid[3][c], grid[2][c], grid[1][c], grid[0][c]];
          let newCol = slideRow(col);
          for (let r = 0; r < 4; r++) grid[3 - r][c] = newCol[r];
        }
      }

      if (prevGrid !== JSON.stringify(grid)) {
        spawnTile();
        render();
      }
    }

    window.addEventListener('keydown', e => {
      if (e.key === 'ArrowLeft') move('left');
      else if (e.key === 'ArrowRight') move('right');
      else if (e.key === 'ArrowUp') move('up');
      else if (e.key === 'ArrowDown') move('down');
    });

    let touchStartX = 0, touchStartY = 0;
    boardEl.addEventListener('touchstart', e => {
      touchStartX = e.touches[0].clientX;
      touchStartY = e.touches[0].clientY;
    });

    boardEl.addEventListener('touchend', e => {
      const dx = e.changedTouches[0].clientX - touchStartX;
      const dy = e.changedTouches[0].clientY - touchStartY;
      if (Math.max(Math.abs(dx), Math.abs(dy)) > 30) {
        if (Math.abs(dx) > Math.abs(dy)) {
          move(dx > 0 ? 'right' : 'left');
        } else {
          move(dy > 0 ? 'down' : 'up');
        }
      }
    });

    restartBtn.addEventListener('click', init);
    init();
  </script>
</body>
</html>
