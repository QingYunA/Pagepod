<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>中英文排版加空格工具 - 盘古之白 (pangu.js)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Based on open source pangu.js by Vinta Chen: https://github.com/vinta/pangu.js (MIT License) -->
  <style>
    :root {
      --bg: #f7f5f0;
      --card-bg: #ffffff;
      --text: #2c2825;
      --text-muted: #78716c;
      --border: #e7e2d9;
      --accent: #92400e;
      --accent-soft: #fef3c7;
      --highlight: #dcfce7;
      --highlight-text: #166534;
      --font-serif: "Songti SC", "SimSun", "STSong", "Noto Serif SC", serif;
      --font-sans: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 24px;
    }
    header {
      max-width: 1200px;
      width: 100%;
      margin: 0 auto 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 16px;
      border-bottom: 2px solid var(--border);
    }
    .brand-title {
      font-family: var(--font-serif);
      font-size: 24px;
      font-weight: 700;
      letter-spacing: 1px;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .badge {
      font-family: var(--font-sans);
      font-size: 11px;
      padding: 3px 8px;
      background: var(--accent-soft);
      color: var(--accent);
      border-radius: 4px;
      font-weight: 600;
    }
    .header-links a {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 13px;
      transition: color 0.15s;
    }
    .header-links a:hover {
      color: var(--accent);
    }
    .container {
      max-width: 1200px;
      width: 100%;
      margin: 0 auto;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .presets-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      background: var(--card-bg);
      padding: 10px 16px;
      border: 1px solid var(--border);
      border-radius: 6px;
    }
    .presets-label {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
    }
    .preset-btn {
      background: #fafaf9;
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 12px;
      padding: 5px 12px;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .preset-btn:hover {
      background: var(--accent-soft);
      border-color: var(--accent);
      color: var(--accent);
    }
    .workspace-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      flex: 1;
      min-height: 480px;
    }
    @media (max-width: 860px) {
      .workspace-grid { grid-template-columns: 1fr; }
    }
    .editor-pane {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .pane-header {
      background: #fafaf9;
      border-bottom: 1px solid var(--border);
      padding: 10px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      font-weight: 600;
    }
    .pane-actions {
      display: flex;
      gap: 8px;
    }
    .action-btn {
      background: #fff;
      border: 1px solid var(--border);
      padding: 4px 10px;
      font-size: 12px;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .action-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }
    .action-btn.primary {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }
    .action-btn.primary:hover {
      opacity: 0.9;
    }
    textarea {
      flex: 1;
      width: 100%;
      border: none;
      padding: 16px;
      font-family: inherit;
      font-size: 14px;
      line-height: 1.8;
      color: var(--text);
      background: transparent;
      resize: none;
      outline: none;
    }
    .diff-view {
      flex: 1;
      padding: 16px;
      font-size: 14px;
      line-height: 1.8;
      overflow-y: auto;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .pangu-space {
      background: var(--highlight);
      color: var(--highlight-text);
      border-radius: 2px;
      padding: 0 1px;
      box-shadow: 0 0 0 1px rgba(22, 101, 52, 0.2);
    }
    .stats-bar {
      background: #fafaf9;
      border-top: 1px solid var(--border);
      padding: 8px 16px;
      display: flex;
      gap: 16px;
      font-size: 11px;
      color: var(--text-muted);
    }
    .stat-item span {
      font-weight: 600;
      color: var(--text);
    }
    footer {
      max-width: 1200px;
      width: 100%;
      margin: 16px auto 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      color: var(--text-muted);
      border-top: 1px solid var(--border);
      padding-top: 12px;
    }
  </style>
</head>
<body>
  <header>
    <div class="brand-title">
      中英文排版加空格工具
      <span class="badge">pangu.js</span>
    </div>
    <div class="header-links">
      <a href="https://github.com/vinta/pangu.js" target="_blank" rel="noopener">Upstream: vinta/pangu.js (MIT)</a>
    </div>
  </header>

  <div class="container">
    <div class="presets-bar">
      <span class="presets-label">示例文本：</span>
      <button class="preset-btn" onclick="loadPreset('tech')">数码科技文案</button>
      <button class="preset-btn" onclick="loadPreset('product')">产品更新公告</button>
      <button class="preset-btn" onclick="loadPreset('academic')">技术文档摘要</button>
      <button class="preset-btn" onclick="loadPreset('dirty')">未排版混排示例</button>
    </div>

    <div class="workspace-grid">
      <div class="editor-pane">
        <div class="pane-header">
          <span>原始文本输入</span>
          <div class="pane-actions">
            <button class="action-btn" onclick="clearInput()">清空</button>
            <button class="action-btn primary" onclick="formatNow()">一键排版</button>
          </div>
        </div>
        <textarea id="inputArea" spellcheck="false" placeholder="在此输入或粘贴需要排版规范化的中英文混排文本..."></textarea>
        <div class="stats-bar">
          <div class="stat-item">字数统计: <span id="inputCharCount">0</span></div>
          <div class="stat-item">中文字符: <span id="inputCnCount">0</span></div>
          <div class="stat-item">英文单词: <span id="inputEnCount">0</span></div>
        </div>
      </div>

      <div class="editor-pane">
        <div class="pane-header">
          <span>规范排版预览与 Diff (Formatted & Spacing Diff)</span>
          <div class="pane-actions">
            <button class="action-btn" id="copyBtn" onclick="copyResult()">复制规范文案</button>
          </div>
        </div>
        <div id="outputArea" class="diff-view"></div>
        <div class="stats-bar">
          <div class="stat-item">优化盘古空格: <span id="spacingAdded">0</span> 处</div>
          <div class="stat-item">标点符号矫正: <span id="punctFixed">0</span> 处</div>
          <div class="stat-item">排版合规率: <span id="complianceRate">100%</span></div>
        </div>
      </div>
    </div>
  </div>

  <footer>
    <div>遵循《中文文案排版指北》及 W3C 中文排版需求规范</div>
    <div>开源核心算法由 Vinta Chen 开源创作，基于 MIT 协议分发</div>
  </footer>

  <script>
    // Authentic pangu.js core regular expressions & algorithm
    const CJK = '\\u2e80-\\u2eff\\u2f00-\\u2fdf\\u3040-\\u309f\\u30a0-\\u30fa\\u30fc-\\u30ff\\u3100-\\u312f\\u3200-\\u32ff\\u3400-\\u4dbf\\u4e00-\\u9fff\\uf900-\\ufaff';
    const ANY_CJK = new RegExp(`[${CJK}]`);
    const CJK_ANS = new RegExp(`([${CJK}])([A-Za-z0-9_\\+\\=\\$\\*\\/])`, 'g');
    const ANS_CJK = new RegExp(`([A-Za-z0-9_\\+\\=\\$\\*\\/])([${CJK}])`, 'g');
    const CJK_QUOTE = new RegExp(`([${CJK}])(["'])`, 'g');
    const QUOTE_CJK = new RegExp(`(["'])([${CJK}])`, 'g');
    const FIX_FULLWIDTH = /([，。！？；：])\s+/g;

    const PRESETS = {
      tech: `今天我们在MacBook Pro上测试了M3 Max芯片的Node.js构建性能，相比上一代V8引擎提速超过35%。在Docker容器内运行PostgreSQL与Redis集群时，99.9%的HTTP请求延迟保持在12ms以内。推荐开发者尽快升级至Next.js 15与Tailwind CSS v4！`,
      product: `全新Pagepod v2.0正式上线！支持一键导入HTML5应用，内置CSP安全沙箱物理隔离，零带宽成本CDN加速。无论您是使用Vue、React还是原生Three.js，都能在10秒内生成高颜值独立展示页。`,
      academic: `本研究提出了一种基于Transformer架构的时序预测模型，在NVIDIA A100 GPU上完成了1000个Epoch的预训练。实验结果表明，该算法在MSE和MAE指标上较传统RNN提升了28.4%，并在真实数据集上展现出优异的泛化能力。`,
      dirty: `请在2026年9月前提交PR请求,包括README.md文档与unit test测试用例!我们的API接口返回JSON格式数据:{"status":200,"message":"ok"}。`
    };

    const inputArea = document.getElementById('inputArea');
    const outputArea = document.getElementById('outputArea');
    const inputCharCount = document.getElementById('inputCharCount');
    const inputCnCount = document.getElementById('inputCnCount');
    const inputEnCount = document.getElementById('inputEnCount');
    const spacingAdded = document.getElementById('spacingAdded');
    const punctFixed = document.getElementById('punctFixed');
    const complianceRate = document.getElementById('complianceRate');
    const copyBtn = document.getElementById('copyBtn');

    function performPanguFormat(text) {
      let addedSpaces = 0;
      let fixedPunct = 0;

      // Spacing between CJK and ANS (Alphabet/Numbers/Symbols)
      let formatted = text.replace(CJK_ANS, (m, c1, c2) => {
        addedSpaces++;
        return `${c1} ${c2}`;
      });

      formatted = formatted.replace(ANS_CJK, (m, c1, c2) => {
        addedSpaces++;
        return `${c1} ${c2}`;
      });

      // Cleanup extra trailing space after full-width punctuation
      formatted = formatted.replace(FIX_FULLWIDTH, (m, p) => {
        fixedPunct++;
        return p;
      });

      return { formatted, addedSpaces, fixedPunct };
    }

    function renderDiff(raw, formatted) {
      // Create visual diff highlighting added spaces
      let html = '';
      let fIdx = 0;
      for (let rIdx = 0; rIdx < raw.length; rIdx++) {
        const rawChar = raw[rIdx];
        if (formatted[fIdx] === rawChar) {
          html += escapeHtml(rawChar);
          fIdx++;
        } else if (formatted[fIdx] === ' ' && rawChar !== ' ') {
          html += '<span class="pangu-space" title="规范补充空格">&nbsp;</span>';
          fIdx++;
          rIdx--; // re-check current rawChar
        } else {
          html += escapeHtml(formatted[fIdx] || '');
          fIdx++;
        }
      }
      while (fIdx < formatted.length) {
        if (formatted[fIdx] === ' ') {
          html += '<span class="pangu-space" title="规范补充空格">&nbsp;</span>';
        } else {
          html += escapeHtml(formatted[fIdx]);
        }
        fIdx++;
      }
      return html;
    }

    function escapeHtml(str) {
      return str
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function update() {
      const raw = inputArea.value;
      const { formatted, addedSpaces, fixedPunct } = performPanguFormat(raw);

      outputArea.innerHTML = raw ? renderDiff(raw, formatted) : '<span style="color: var(--text-muted); font-style: italic;">规范化排版文本将实时在此呈现...</span>';

      // Update counters
      inputCharCount.textContent = raw.length;
      const cnMatches = raw.match(new RegExp(`[${CJK}]`, 'g'));
      inputCnCount.textContent = cnMatches ? cnMatches.length : 0;
      const enMatches = raw.match(/[a-zA-Z]+/g);
      inputEnCount.textContent = enMatches ? enMatches.length : 0;

      spacingAdded.textContent = addedSpaces;
      punctFixed.textContent = fixedPunct;

      if (raw.length === 0) {
        complianceRate.textContent = '100%';
      } else {
        const penalty = Math.min(60, (addedSpaces + fixedPunct) * 4);
        complianceRate.textContent = `${Math.max(40, 100 - penalty)}%`;
      }
    }

    function loadPreset(key) {
      inputArea.value = PRESETS[key] || '';
      update();
    }

    function clearInput() {
      inputArea.value = '';
      update();
      inputArea.focus();
    }

    function formatNow() {
      const raw = inputArea.value;
      const { formatted } = performPanguFormat(raw);
      inputArea.value = formatted;
      update();
    }

    function copyResult() {
      const raw = inputArea.value;
      const { formatted } = performPanguFormat(raw);
      if (!formatted) return;

      navigator.clipboard.writeText(formatted).then(() => {
        const origText = copyBtn.textContent;
        copyBtn.textContent = '✓ 已复制到剪贴板';
        copyBtn.style.color = '#166534';
        setTimeout(() => {
          copyBtn.textContent = origText;
          copyBtn.style.color = '';
        }, 2000);
      });
    }

    inputArea.addEventListener('input', update);

    // Initial load
    loadPreset('tech');
  </script>
</body>
</html>
