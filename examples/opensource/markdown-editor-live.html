<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Markdown Live Studio & Word Counter</title>
  <!--
    Open Source Provenance:
    Author: Open Source Community & marked.js
    License: MIT
  -->
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #ffffff;
      color: #18181b;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 0.6rem 1.25rem;
      background: #fafafa;
      border-bottom: 1px solid #e4e4e7;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    h1 { font-size: 0.95rem; font-weight: 600; color: #09090b; }
    .toolbar { display: flex; gap: 0.5rem; align-items: center; }
    button {
      background: #ffffff;
      color: #71717a;
      border: 1px solid #e4e4e7;
      border-radius: 6px;
      padding: 0.4rem 0.8rem;
      font-size: 0.8rem;
      cursor: pointer;
      transition: all 0.15s;
    }
    button:hover { background: #f4f4f5; color: #18181b; }
    button.primary { background: #18181b; color: #ffffff; border-color: #18181b; font-weight: 600; }
    button.primary:hover { opacity: 0.9; }
    main {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      overflow: hidden;
    }
    .editor-pane {
      display: flex;
      flex-direction: column;
      border-right: 1px solid #e4e4e7;
      background: #fafafa;
    }
    textarea {
      flex: 1;
      background: transparent;
      color: #09090b;
      border: none;
      resize: none;
      padding: 1.25rem;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.9rem;
      line-height: 1.6;
      outline: none;
    }
    .preview-pane {
      padding: 1.25rem 2rem;
      overflow-y: auto;
      background: #ffffff;
      color: #27272a;
      font-size: 0.95rem;
      line-height: 1.7;
    }
    .preview-pane h1 { font-size: 1.75rem; color: #09090b; margin-bottom: 0.75rem; border-bottom: 1px solid #e4e4e7; padding-bottom: 0.5rem; }
    .preview-pane h2 { font-size: 1.35rem; color: #09090b; margin-top: 1.25rem; margin-bottom: 0.5rem; }
    .preview-pane h3 { font-size: 1.1rem; color: #09090b; margin-top: 1rem; margin-bottom: 0.4rem; }
    .preview-pane p { margin-bottom: 1rem; }
    .preview-pane ul, .preview-pane ol { margin-left: 1.5rem; margin-bottom: 1rem; }
    .preview-pane code { background: #f4f4f5; padding: 0.2rem 0.4rem; border-radius: 4px; font-family: ui-monospace, monospace; font-size: 0.85em; color: #0284c7; border: 1px solid #e4e4e7; }
    .preview-pane pre { background: #f8fafc; padding: 1rem; border-radius: 8px; border: 1px solid #e2e8f0; overflow-x: auto; margin-bottom: 1rem; }
    .preview-pane pre code { background: transparent; padding: 0; color: #0f172a; border: none; }
    .preview-pane blockquote { border-left: 3px solid #2563eb; padding-left: 1rem; color: #52525b; margin-bottom: 1rem; }
    footer {
      padding: 0.4rem 1.25rem;
      background: #fafafa;
      border-top: 1px solid #e4e4e7;
      font-size: 0.75rem;
      color: #71717a;
      display: flex;
      justify-content: space-between;
      font-family: ui-monospace, monospace;
    }
  </style>
</head>
<body>
  <header>
    <h1>Markdown Live Studio</h1>
    <div class="toolbar">
      <button onclick="copyHtml()">Copy Clean HTML</button>
      <button onclick="copyMarkdown()" class="primary">Copy Markdown</button>
    </div>
  </header>

  <main>
    <div class="editor-pane">
      <textarea id="editor" placeholder="Write markdown here..."></textarea>
    </div>
    <div class="preview-pane" id="preview"></div>
  </main>

  <footer>
    <span id="stats">Words: 0 | Characters: 0 | Reading Time: 0 min</span>
    <span>Live Client-Side Rendering · Zero Server Upload</span>
  </footer>

  <script>
    // Lightweight self-contained markdown parser
    function parseMarkdown(md) {
      let html = md
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        // Headers
        .replace(/^### (.*$)/gim, '<h3>$1</h3>')
        .replace(/^## (.*$)/gim, '<h2>$1</h2>')
        .replace(/^# (.*$)/gim, '<h1>$1</h1>')
        // Blockquote
        .replace(/^\> (.*$)/gim, '<blockquote>$1</blockquote>')
        // Bold & Italic
        .replace(/\*\*(.*?)\*\*/gim, '<strong>$1</strong>')
        .replace(/\*(.*?)\*/gim, '<em>$1</em>')
        // Code block
        .replace(/```([\s\S]*?)```/gim, '<pre><code>$1</code></pre>')
        // Inline code
        .replace(/`([^`]+)`/gim, '<code>$1</code>')
        // Links
        .replace(/\[([^\]]+)\]\(([^)]+)\)/gim, '<a href="$2" target="_blank" rel="noopener noreferrer" style="color: #60a5fa;">$1</a>')
        // Unordered list
        .replace(/^\s*\n\*/gm, '<ul>\n*')
        .replace(/^(\*.+)\s*\n([^\*])/gm, '$1\n</ul>\n\n$2')
        .replace(/^\* (.*$)/gim, '<li>$1</li>')
        // Paragraphs
        .replace(/\n\n+/g, '</p><p>');

      return '<p>' + html + '</p>';
    }

    const sample = `# Engineering Principles

Welcome to the **Pagepod Markdown Studio**. Draft technical proposals, documentation, or blog articles with instant visual feedback.

## Key Highlights
* **Zero Latency**: Real-time parser renders as you type without debounce delay.
* **100% Client-Side**: Your text stays securely in browser memory.
* **Instant Export**: One-click copy for clean HTML or Markdown.

### Code Sample
\`\`\`javascript
const port = 3000;
console.log('App listening on port', port);
\`\`\`

> "Good design is as little design as possible." — Dieter Rams
`;

    const editor = document.getElementById('editor');
    const preview = document.getElementById('preview');
    const stats = document.getElementById('stats');

    editor.value = sample;
    update();

    editor.addEventListener('input', update);

    function update() {
      const text = editor.value;
      preview.innerHTML = parseMarkdown(text);

      const words = text.trim() ? text.trim().split(/\s+/).length : 0;
      const chars = text.length;
      const readingTime = Math.ceil(words / 200);

      stats.textContent = `Words: ${words} | Characters: ${chars} | Reading Time: ~${readingTime} min`;
    }

    function copyMarkdown() {
      navigator.clipboard.writeText(editor.value);
      alert('Markdown copied to clipboard!');
    }

    function copyHtml() {
      navigator.clipboard.writeText(preview.innerHTML);
      alert('Parsed HTML copied to clipboard!');
    }
  </script>
</body>
</html>
