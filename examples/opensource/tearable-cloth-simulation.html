<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Tearable Cloth Physics Simulation</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Original Open Source by dissimulate: https://github.com/dissimulate/Tearable-Cloth (MIT License) -->
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #111215;
      color: #e4e4e7;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      user-select: none;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      cursor: crosshair;
    }
    .hud {
      position: absolute;
      top: 20px;
      left: 24px;
      background: rgba(24, 24, 28, 0.85);
      backdrop-filter: blur(8px);
      border: 1px solid #2e2e36;
      border-radius: 8px;
      padding: 12px 18px;
      pointer-events: none;
      font-size: 13px;
      line-height: 1.6;
    }
    .hud h1 {
      font-size: 15px;
      font-weight: 600;
      color: #60a5fa;
      margin-bottom: 4px;
    }
    .hint {
      color: #a1a1aa;
      font-size: 11px;
    }
    .badge {
      display: inline-block;
      font-size: 10px;
      color: #34d399;
      background: rgba(52, 211, 153, 0.1);
      border: 1px solid rgba(52, 211, 153, 0.3);
      padding: 2px 6px;
      border-radius: 4px;
      margin-top: 4px;
    }
    .controls {
      position: absolute;
      bottom: 24px;
      right: 24px;
      display: flex;
      gap: 8px;
    }
    button {
      background: #1e1e24;
      color: #fff;
      border: 1px solid #3d3d4a;
      padding: 8px 14px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
      font-weight: 500;
      transition: background 0.15s ease;
    }
    button:hover { background: #2b2b36; }
  </style>
</head>
<body>

  <div class="hud">
    <h1>Tearable Cloth 2D Physics</h1>
    <div class="hint">&bull; Left Click + Drag: Grab and pull cloth</div>
    <div class="hint">&bull; Right Click + Drag: Tear / cut cloth mesh</div>
    <div class="badge">Verlet Integration Physics &bull; MIT License</div>
  </div>

  <canvas id="c"></canvas>

  <div class="controls">
    <button id="btnReset">Reset Cloth</button>
  </div>

  <script>
    // Physics constants
    const physics_accuracy = 4;
    const mouse_influence = 20;
    const mouse_cut = 6;
    const gravity = 1200;
    const cloth_height = 36;
    const cloth_width = 55;
    const start_y = 20;
    const spacing = 9;
    const tear_distance = 60;

    let canvas, ctx, width, height;
    let cloth;
    let boundsx, boundsy;
    let mouse = {
      down: false,
      button: 1,
      x: 0,
      y: 0,
      px: 0,
      py: 0
    };

    class Point {
      constructor(x, y) {
        this.x = x;
        this.y = y;
        this.px = x;
        this.py = y;
        this.vx = 0;
        this.vy = 0;
        this.pin_x = null;
        this.pin_y = null;
        this.constraints = [];
      }

      update(delta) {
        if (this.pin_x !== null && this.pin_y !== null) {
          this.x = this.pin_x;
          this.y = this.pin_y;
          return;
        }

        if (mouse.down) {
          const diff_x = this.x - mouse.x;
          const diff_y = this.y - mouse.y;
          const dist = Math.sqrt(diff_x * diff_x + diff_y * diff_y);

          if (mouse.button === 1 && dist < mouse_influence) {
            this.px = this.x - (mouse.x - mouse.px) * 1.8;
            this.py = this.y - (mouse.y - mouse.py) * 1.8;
          } else if (dist < mouse_cut) {
            this.constraints = [];
          }
        }

        this.add_force(0, gravity);

        const delta_sq = delta * delta;
        const nx = this.x + ((this.x - this.px) * 0.99) + ((this.vx / 2) * delta_sq);
        const ny = this.y + ((this.y - this.py) * 0.99) + ((this.vy / 2) * delta_sq);

        this.px = this.x;
        this.py = this.y;

        this.x = nx;
        this.y = ny;

        this.vy = this.vx = 0;
      }

      resolve_constraints() {
        if (this.pin_x !== null && this.pin_y !== null) {
          this.x = this.pin_x;
          this.y = this.pin_y;
          return;
        }

        for (let i = this.constraints.length - 1; i >= 0; i--) {
          this.constraints[i].resolve();
        }

        if (this.x > boundsx) { this.x = 2 * boundsx - this.x; this.px = boundsx; }
        else if (this.x < 1) { this.x = 2 - this.x; this.px = 1; }

        if (this.y > boundsy) { this.y = 2 * boundsy - this.y; this.py = boundsy; }
        else if (this.y < 1) { this.y = 2 - this.y; this.py = 1; }
      }

      attach(point) {
        this.constraints.push(new Constraint(this, point));
      }

      remove_constraint(lnk) {
        const idx = this.constraints.indexOf(lnk);
        if (idx !== -1) this.constraints.splice(idx, 1);
      }

      add_force(x, y) {
        this.vx += x;
        this.vy += y;
      }

      pin(pinx, piny) {
        this.pin_x = pinx;
        this.pin_y = piny;
      }
    }

    class Constraint {
      constructor(p1, p2) {
        this.p1 = p1;
        this.p2 = p2;
        this.length = spacing;
      }

      resolve() {
        const diff_x = this.p1.x - this.p2.x;
        const diff_y = this.p1.y - this.p2.y;
        const dist = Math.sqrt(diff_x * diff_x + diff_y * diff_y);
        const diff = (this.length - dist) / dist;

        if (dist > tear_distance) {
          this.p1.remove_constraint(this);
        }

        const px = diff_x * diff * 0.5;
        const py = diff_y * diff * 0.5;

        this.p1.x += px;
        this.p1.y += py;
        this.p2.x -= px;
        this.p2.y -= py;
      }

      draw() {
        ctx.moveTo(this.p1.x, this.p1.y);
        ctx.lineTo(this.p2.x, this.p2.y);
      }
    }

    class Cloth {
      constructor() {
        this.points = [];
        const start_x = canvas.width / 2 - (cloth_width * spacing) / 2;

        for (let y = 0; y <= cloth_height; y++) {
          for (let x = 0; x <= cloth_width; x++) {
            const p = new Point(start_x + x * spacing, start_y + y * spacing);
            if (x !== 0) p.attach(this.points[this.points.length - 1]);
            if (y === 0) p.pin(p.x, p.y);
            if (y !== 0) p.attach(this.points[x + (y - 1) * (cloth_width + 1)]);
            this.points.push(p);
          }
        }
      }

      update(delta) {
        let i = physics_accuracy;
        while (i--) {
          for (let j = this.points.length - 1; j >= 0; j--) {
            this.points[j].resolve_constraints();
          }
        }
        for (let j = this.points.length - 1; j >= 0; j--) {
          this.points[j].update(delta);
        }
      }

      draw() {
        ctx.beginPath();
        for (let i = this.points.length - 1; i >= 0; i--) {
          const c = this.points[i].constraints;
          for (let j = c.length - 1; j >= 0; j--) {
            c[j].draw();
          }
        }
        ctx.strokeStyle = '#4a5568';
        ctx.lineWidth = 1;
        ctx.stroke();
      }
    }

    function init() {
      canvas = document.getElementById('c');
      ctx = canvas.getContext('2d');
      resize();
      cloth = new Cloth();
    }

    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
      boundsx = width - 1;
      boundsy = height - 1;
    }
    window.addEventListener('resize', () => { resize(); cloth = new Cloth(); });

    let lastTime = 0;
    function update(time) {
      if (!lastTime) lastTime = time;
      const delta = (time - lastTime) * 0.001;
      lastTime = time;

      ctx.clearRect(0, 0, canvas.width, canvas.height);
      cloth.update(Math.min(delta, 0.035));
      cloth.draw();

      mouse.px = mouse.x;
      mouse.py = mouse.y;

      requestAnimationFrame(update);
    }

    window.addEventListener('mousedown', (e) => {
      mouse.button = e.which;
      mouse.px = mouse.x = e.clientX;
      mouse.py = mouse.y = e.clientY;
      mouse.down = true;
    });

    window.addEventListener('mouseup', () => mouse.down = false);
    window.addEventListener('mousemove', (e) => {
      mouse.x = e.clientX;
      mouse.y = e.clientY;
    });
    window.addEventListener('contextmenu', (e) => e.preventDefault());

    document.getElementById('btnReset').addEventListener('click', () => {
      cloth = new Cloth();
    });

    init();
    requestAnimationFrame(update);
  </script>
</body>
</html>
