<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tic Tac Toe vs AI (Minimax)</title>
  <!--
    Open Source Provenance:
    Author: Open Source Game Algorithms
    License: MIT
  -->
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #09090b;
      color: #fafafa;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .card {
      max-width: 380px;
      width: 100%;
      background: #18181b;
      border: 1px solid #27272a;
      border-radius: 20px;
      padding: 1.75rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }
    h1 { font-size: 1.25rem; font-weight: 700; margin-bottom: 0.25rem; }
    .status { font-size: 0.9rem; color: #a1a1aa; margin-bottom: 1.5rem; height: 1.25rem; }
    .board {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      width: 100%;
      aspect-ratio: 1;
      margin-bottom: 1.5rem;
    }
    .cell {
      background: #27272a;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.5rem;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.15s;
    }
    .cell:hover { background: #3f3f46; }
    .cell.x { color: #38bdf8; }
    .cell.o { color: #f43f5e; }
    button {
      width: 100%;
      height: 42px;
      border-radius: 10px;
      border: none;
      background: #fafafa;
      color: #09090b;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    button:hover { opacity: 0.9; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Tic Tac Toe vs AI</h1>
    <div class="status" id="status">Your turn (X)</div>

    <div class="board" id="board">
      <div class="cell" onclick="makeMove(0)"></div>
      <div class="cell" onclick="makeMove(1)"></div>
      <div class="cell" onclick="makeMove(2)"></div>
      <div class="cell" onclick="makeMove(3)"></div>
      <div class="cell" onclick="makeMove(4)"></div>
      <div class="cell" onclick="makeMove(5)"></div>
      <div class="cell" onclick="makeMove(6)"></div>
      <div class="cell" onclick="makeMove(7)"></div>
      <div class="cell" onclick="makeMove(8)"></div>
    </div>

    <button onclick="resetGame()">Restart Game</button>
  </div>

  <script>
    let board = ["", "", "", "", "", "", "", "", ""];
    let gameOver = false;
    const human = "X";
    const ai = "O";

    const winCombos = [
      [0, 1, 2], [3, 4, 5], [6, 7, 8],
      [0, 3, 6], [1, 4, 7], [2, 5, 8],
      [0, 4, 8], [2, 4, 6]
    ];

    function checkWin(b, player) {
      return winCombos.some(combo => combo.every(idx => b[idx] === player));
    }

    function checkTie(b) {
      return b.every(cell => cell !== "");
    }

    function makeMove(idx) {
      if (board[idx] !== "" || gameOver) return;

      board[idx] = human;
      render();

      if (checkWin(board, human)) {
        document.getElementById("status").textContent = "🎉 You win!";
        gameOver = true;
        return;
      }
      if (checkTie(board)) {
        document.getElementById("status").textContent = "🤝 It's a draw!";
        gameOver = true;
        return;
      }

      document.getElementById("status").textContent = "AI is thinking...";
      setTimeout(aiMove, 250);
    }

    function aiMove() {
      if (gameOver) return;
      const bestMove = minimax(board, ai).index;
      board[bestMove] = ai;
      render();

      if (checkWin(board, ai)) {
        document.getElementById("status").textContent = "🤖 AI wins!";
        gameOver = true;
        return;
      }
      if (checkTie(board)) {
        document.getElementById("status").textContent = "🤝 It's a draw!";
        gameOver = true;
        return;
      }

      document.getElementById("status").textContent = "Your turn (X)";
    }

    function minimax(newBoard, player) {
      const availSpots = newBoard.map((val, idx) => val === "" ? idx : null).filter(val => val !== null);

      if (checkWin(newBoard, human)) return { score: -10 };
      if (checkWin(newBoard, ai)) return { score: 10 };
      if (availSpots.length === 0) return { score: 0 };

      const moves = [];
      for (let i = 0; i < availSpots.length; i++) {
        const move = {};
        move.index = availSpots[i];
        newBoard[availSpots[i]] = player;

        if (player === ai) {
          const result = minimax(newBoard, human);
          move.score = result.score;
        } else {
          const result = minimax(newBoard, ai);
          move.score = result.score;
        }

        newBoard[availSpots[i]] = "";
        moves.push(move);
      }

      let bestMove;
      if (player === ai) {
        let bestScore = -10000;
        for (let i = 0; i < moves.length; i++) {
          if (moves[i].score > bestScore) {
            bestScore = moves[i].score;
            bestMove = i;
          }
        }
      } else {
        let bestScore = 10000;
        for (let i = 0; i < moves.length; i++) {
          if (moves[i].score < bestScore) {
            bestScore = moves[i].score;
            bestMove = i;
          }
        }
      }
      return moves[bestMove];
    }

    function render() {
      const cells = document.querySelectorAll(".cell");
      cells.forEach((cell, idx) => {
        cell.textContent = board[idx];
        cell.className = "cell";
        if (board[idx] === "X") cell.classList.add("x");
        if (board[idx] === "O") cell.classList.add("o");
      });
    }

    function resetGame() {
      board = ["", "", "", "", "", "", "", "", ""];
      gameOver = false;
      document.getElementById("status").textContent = "Your turn (X)";
      render();
    }
  </script>
</body>
</html>
